<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ================= Bootstrap & icons ================= -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css"
        integrity="sha512-F/yRpRY8sctKzP7exU5PLGejwg/QtjDX6CIy/41nApe7JqdZgCcCzJTNq9Rcp/XwbeeTGillGevBakruY15pxA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- ================= Custom CSS ================= -->
    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/top-bar.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/navbar.css">

    <link rel="stylesheet" href="../css/hero.css">
    <link rel="stylesheet" href="../css/features.css">
    <link rel="stylesheet" href="../css/categories.css">
    <link rel="stylesheet" href="../css/products.css">

    <link rel="stylesheet" href="../css/auth.css">

    <link rel="stylesheet" href="../css/news.css">
    <link rel="stylesheet" href="../css/instagram.css">
    <link rel="stylesheet" href="../css/newsletter.css">
    <link rel="stylesheet" href="../css/footer.css">

    <link rel="stylesheet" href="../css/responsive.css">

    <link rel="stylesheet" href="../css/FAQ.css">
    <link rel="stylesheet" href="../css/checkout.css">

    <title>Shopery</title>
</head>

<body>
    <section>
        <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb" class="bg-veg py-4 ">
            <div class="container">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item text-secondary"><a href="../index.html "><i
                                class="fa-solid fa-house text-secondary"></i></a>
                    </li>
                    <li class="breadcrumb-item active text-secondary" aria-current="page"><a href="#"
                            class="text-secondary">Shopping Cart</a></li>
                    <li class="breadcrumb-item active text-secondary" aria-current="page"><a href="#"
                            class="text-success">checkout</a></li>
                </ol>
            </div>
        </nav>
    </section>
    <div class="row container mx-auto">
        <form class="row g-3 col-8">
            <h3>Billing Information</h3>
            <div class="col-4">
                <label for="inputFirstName" class="form-label">First name</label>
                <input type="text" class="form-control" id="inputFirstName" placeholder="Your first name">
            </div>
            <div class="col-4">
                <label for="inputLastName" class="form-label">Last name</label>
                <input type="text" class="form-control" id="inputLastName" placeholder="Your last name">
            </div>
            <div class="col-4">
                <label for="inputCompanyName" class="form-label">Company Name (optional)</label>
                <input type="text" class="form-control" id="inputCompanyName" placeholder="Company name">
            </div>
            <div class="col-12">
                <label for="inputStreetAddress" class="form-label">Street Address</label>
                <input type="text" class="form-control" id="inputStreetAddress" placeholder="Email">
            </div>
            <div class="col-4">
                <label for="inputCountry" class="form-label">Country / Region</label>
                <select id="inputCountry" class="form-select">
                    <option selected>Select</option>
                    <option>...</option>
                </select>
            </div>
            <div class="col-4">
                <label for="inputStates" class="form-label">States</label>
                <select id="inputStates" class="form-select">
                    <option selected>Selects</option>
                    <option>...</option>
                </select>
            </div>
            <div class="col-4">
                <label for="inputZip" class="form-label">Zip Code</label>
                <input type="text" class="form-control" id="inputZip" placeholder="Zip Code">
            </div>
            <div class="col-4">
                <label for="inputEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="inputEmail" placeholder="Email Address">
            </div>
            <div class="col-4">
                <label for="inputPhone" class="form-label">Phone</label>
                <input type="text" class="form-control" id="inputPhone" placeholder="Phone number">
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="gridCheck">
                    <label class="form-check-label" for="gridCheck">
                        Ship to a different address
                    </label>
                </div>
            </div>
            <hr>
            <h3>Additional Info</h3>
            <div class="col-12">
                <label for="inputOrderNotes" class="form-label">Order Notes (Optional)</label>
                <textarea class="form-control hightt" id="inputOrderNotes"
                    placeholder="Notes about your order, e.g. special notes for delivery"></textarea>
            </div>
        </form>
        <div class="Order Summery col-4">

        </div>
    </div>
</body>

</html>
